# multicz.toml - versioning, changelog and tagging driven by Conventional
# Commits. Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
tag_format = "v{version}"
initial_version = "0.0.0"
# Regenerate uv.lock after each bump so the lockfile tracks the new version;
# without `allow` multicz skips the hook and the next `uv sync --frozen` in
# CI fails on lockfile drift.
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"
deprecate = "minor"
remove = "minor"

[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Deprecated"
types = ["deprecate"]

[[project.changelog_sections]]
title = "Removed"
types = ["remove"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[components.ansible-gitea]
# Curated: only the Ansible content and the files that define how it runs
# count toward a release. Documentation, governance, CI and tooling config
# are intentionally untracked, so a README fix never ships a version.
paths = [
    "roles/**",
    "playbooks/**",
    "inventory/**",
    "ansible.cfg",
    "requirements.yml",
    "pyproject.toml",
]
bump_files = [{ file = "pyproject.toml", key = "project.version" }]
changelog = "CHANGELOG.md"
post_bump = ["uv lock"]
