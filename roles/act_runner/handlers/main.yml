---

# Handlers flush at the end of the play, by which point the units exist and
# are started, so a plain restart of every instance is safe.
- name: Restart the act_runner agents
  ansible.builtin.systemd_service:
    name: "act_runner@{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ act_runner_instance_names }}"
