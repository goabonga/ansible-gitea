---

# Release to install. The binary is fetched from dl.gitea.com and verified
# against the published .sha256 file.
gitea_version: "1.27.1"
gitea_arch: amd64
gitea_download_url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-{{ gitea_arch }}"
# The checksum file names the versioned artefact, which is why the download
# keeps that name on disk and /usr/local/bin/gitea is only a symlink.
gitea_download_checksum: "sha256:{{ gitea_download_url }}.sha256"
gitea_install_dir: /usr/local/lib/gitea
gitea_binary: /usr/local/bin/gitea

gitea_packages:
  - git
  - git-lfs
  # setfacl, needed when Ansible becomes the unprivileged `git` account.
  - acl

# Service account and filesystem layout (upstream's recommended layout).
gitea_user: git
gitea_group: git
gitea_home: /home/git
gitea_config_dir: /etc/gitea
gitea_config_file: /etc/gitea/app.ini
gitea_work_dir: /var/lib/gitea
gitea_data_dir: /var/lib/gitea/data
gitea_repository_root: /var/lib/gitea/data/gitea-repositories
gitea_lfs_dir: /var/lib/gitea/data/lfs
gitea_log_dir: /var/log/gitea

gitea_app_name: Gitea local lab
gitea_run_mode: prod
gitea_http_addr: 0.0.0.0
gitea_http_port: 3000
gitea_domain: "{{ ansible_host | default(inventory_hostname) }}"
gitea_root_url: "http://{{ gitea_domain }}:{{ gitea_http_port }}/"

# --- TLS from the internal CA ------------------------------------------
# Enabled by the optional services stack. The certificate is issued by
# step-ca with a one-time token minted on the CA guest (see
# playbooks/gitea.yml) and renewed by a systemd timer.
gitea_tls_enabled: false
gitea_tls_dir: /etc/gitea/tls
gitea_tls_cert: /etc/gitea/tls/gitea.crt
gitea_tls_key: /etc/gitea/tls/gitea.key
# Names the certificate must cover. 127.0.0.1 is one of them so the role's own
# health check can verify the chain locally. The playbook bakes this list into
# the issuance token; the CA will not sign anything outside it.
gitea_tls_sans:
  - "{{ gitea_domain }}"
  - 127.0.0.1
gitea_tls_ca_url: ""
gitea_tls_ca_fingerprint: ""
gitea_tls_token: ""
gitea_tls_reload_script: /usr/local/sbin/gitea-cert-reload
gitea_tls_renew_unit: gitea-cert-renew
# Certificates live 24h; checking twice an hour and renewing with 8h left
# leaves plenty of room for a guest that was suspended for a while.
gitea_tls_renew_calendar: "*:0/30"
gitea_tls_renew_expires_in: 8h

# Gitea's built-in SSH server: no system account juggling, and it stays off
# port 22 so the guest's own sshd keeps working.
gitea_start_ssh_server: true
gitea_ssh_domain: "{{ gitea_domain }}"
gitea_ssh_port: 2222

# `postgres` or `sqlite3`. PostgreSQL is installed on the guest itself.
gitea_db_type: postgres
gitea_db_host: 127.0.0.1:5432
gitea_db_name: gitea
gitea_db_user: gitea
gitea_db_password: changeme
gitea_db_packages:
  - postgresql
  - python3-psycopg2
# Home of the `postgres` account on Debian and Ubuntu; only used to place the
# Ansible temp directory the postgresql tasks need.
gitea_db_user_home: /var/lib/postgresql

# Instance administrator, created once through the CLI.
gitea_admin_username: gitea-admin
gitea_admin_password: changeme
gitea_admin_email: gitea-admin@example.invalid

# API endpoint used by the role itself. 127.0.0.1 is one of the certificate's
# SANs, so this needs no DNS and still verifies the chain.
gitea_api_url: "{{ 'https' if gitea_tls_enabled | bool else 'http' }}://127.0.0.1:{{ gitea_http_port }}"

# Organisations created through the API once the administrator exists. Set
# `gitea_organizations: []` to keep the instance empty.
gitea_organizations_enabled: true
gitea_organizations:
  - username: lab
    full_name: Lab
    description: Working area for the local lab
    visibility: private

gitea_disable_registration: true
gitea_require_signin_view: false
# The lab has no outbound mail and is not meant to phone home.
gitea_update_checker: false

# Gitea Actions. `DEFAULT_ACTIONS_URL = github` lets workflows keep using
# `uses: actions/checkout@v4` unchanged.
gitea_actions_enabled: true
gitea_actions_default_url: github
# Registration token handed to the act_runner agents. It lives in the
# Gitea-writable state directory, so the runners play can read it back.
gitea_runner_token_file: /var/lib/gitea/runner-registration-token

# Generated once and pinned in app.ini, so the config file can stay
# read-only for the service account.
gitea_secrets:
  - SECRET_KEY
  - INTERNAL_TOKEN
  - JWT_SECRET
  - LFS_JWT_SECRET
