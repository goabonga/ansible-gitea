---

- name: Install the Gitea prerequisites
  ansible.builtin.import_tasks: prerequisites.yml
  tags:
    - gitea_install

- name: Provision the Gitea database
  ansible.builtin.import_tasks: database.yml
  when: gitea_db_type == "postgres"
  tags:
    - gitea_database

- name: Install the Gitea binary
  ansible.builtin.import_tasks: install.yml
  tags:
    - gitea_install

- name: Configure Gitea
  ansible.builtin.import_tasks: configure.yml
  tags:
    - gitea_config

- name: Run Gitea under systemd
  ansible.builtin.import_tasks: service.yml
  tags:
    - gitea_service

- name: Create the Gitea administrator
  ansible.builtin.import_tasks: admin.yml
  tags:
    - gitea_admin

- name: Create the organisations
  ansible.builtin.import_tasks: organizations.yml
  when:
    - gitea_organizations_enabled | bool
    - gitea_organizations | length > 0
  tags:
    - gitea_organizations

- name: Prepare Gitea Actions
  ansible.builtin.import_tasks: actions.yml
  when: gitea_actions_enabled
  tags:
    - gitea_actions
