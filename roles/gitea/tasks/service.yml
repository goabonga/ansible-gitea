---

- name: Install the gitea systemd unit
  ansible.builtin.template:
    src: gitea.service.j2
    dest: /etc/systemd/system/gitea.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart gitea

- name: Enable and start gitea
  ansible.builtin.systemd_service:
    name: gitea
    state: started
    enabled: true
    daemon_reload: true

# A restart notified above still runs at the end of the play, so flush it
# here: the CLI tasks that follow talk to the running instance.
- name: Apply the pending gitea restart
  ansible.builtin.meta: flush_handlers

- name: Wait for the Gitea API to answer
  ansible.builtin.uri:
    # gitea_api_url points at 127.0.0.1, one of the certificate's SANs, and the
    # internal root is in the guest's trust store: verified even locally.
    url: "{{ gitea_api_url }}/api/healthz"
    status_code: 200
  register: gitea_health
  until: gitea_health.status == 200
  retries: 30
  delay: 5
