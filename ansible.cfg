[defaults]
inventory = inventory/local.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
retry_files_enabled = False
# ansible-core dropped the standalone `yaml` stdout callback; the default one
# renders YAML through callback_result_format. profile_tasks now ships in
# ansible.posix (see requirements.yml).
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# The lab VMs are disposable and get recreated with the same addresses, so
# their host keys legitimately change on every rebuild.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
