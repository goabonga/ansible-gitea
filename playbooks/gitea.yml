# Installs Gitea on the guest and mints the runner registration token that
# `runners.yml` consumes.
---

- name: Deploy Gitea
  hosts: gitea
  become: true
  gather_facts: true
  roles:
    - role: gitea

  post_tasks:
    - name: Show how to reach the instance
      ansible.builtin.debug:
        msg:
          - "Gitea is up on {{ gitea_root_url | trim }}"
          - "Sign in as {{ gitea_admin_username }} (password: group_vars/gitea.yml)"
          - "Clone over SSH with port {{ gitea_ssh_port }}, e.g."
          - >-
            git clone ssh://{{ gitea_user }}@{{ gitea_domain }}:{{ gitea_ssh_port
            }}/<owner>/<repo>.git
