# The lab's internal services: a certificate authority (step-ca) and a resolver
# for the lab domain (dnsmasq). Both run on the Gitea guest — two mostly idle
# daemons on ports nothing else uses (9000 and 53).
#
# Skipped entirely unless `lab_services_enabled` is true. It runs before
# playbooks/gitea.yml because that is where Gitea's certificate comes from.
---

- name: Deploy the internal services
  hosts: gitea
  become: true
  # Deferred on purpose: gathering facts at play level would connect — and
  # fail as unreachable on a lab that is not up — before the condition below
  # gets a chance to make this playbook the no-op it should be.
  gather_facts: false
  tasks:
    - name: Set up the internal domain
      when: lab_services_enabled | bool
      block:
        - name: Gather the guest facts
          ansible.builtin.setup:

        - name: Run the certificate authority
          ansible.builtin.include_role:
            name: step_ca
          when: lab_step_ca_enabled | bool
          tags:
            - step_ca

        - name: Run the internal resolver
          ansible.builtin.include_role:
            name: internal_dns
          when: lab_dnsmasq_enabled | bool
          tags:
            - dnsmasq

- name: Point the guests at the internal resolver and CA
  hosts: lab
  become: true
  gather_facts: false
  tasks:
    - name: Wire the guest into the internal domain
      when: lab_services_enabled | bool
      block:
        - name: Gather the guest facts
          ansible.builtin.setup:

        - name: Resolve the lab domain
          ansible.builtin.include_role:
            name: internal_resolver
          when: lab_dnsmasq_enabled | bool
          tags:
            - dnsmasq

        - name: Trust the internal certificate authority
          ansible.builtin.include_role:
            name: internal_ca_trust
          when: lab_step_ca_enabled | bool
          tags:
            - step_ca

# The whole point of the stack: reaching https://gitea.internal from the
# workstation's own browser and git client.
- name: Point the workstation at the lab
  hosts: kvm_hosts
  gather_facts: false
  tasks:
    - name: Wire the workstation into the internal domain
      when:
        - lab_services_enabled | bool
        - lab_configure_workstation | bool
      # The resolver drop-in and the trust store both live under /etc, so the
      # whole block runs privileged.
      become: true
      block:
        - name: Resolve the lab domain
          ansible.builtin.include_role:
            name: internal_resolver
          when: lab_dnsmasq_enabled | bool
          tags:
            - dnsmasq

        - name: Trust the internal certificate authority
          ansible.builtin.include_role:
            name: internal_ca_trust
          when: lab_step_ca_enabled | bool
          tags:
            - step_ca

        - name: Show what the workstation can now reach
          ansible.builtin.debug:
            msg:
              - "{{ lab_gitea_fqdn }} resolves through {{ hostvars[lab_services_host].vm_ip }}"
              - "The internal root certificate is trusted system-wide."
              - >-
                Firefox and Chrome keep their own stores: import
                {{ lab_state_dir }}/root_ca.crt there, or set
                security.enterprise_roots.enabled=true in Firefox.
