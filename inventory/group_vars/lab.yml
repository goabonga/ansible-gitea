# How Ansible reaches the guests: static address applied by cloud-init and
# the lab keypair generated by the `kvm_host` role.
---

ansible_host: "{{ vm_ip }}"
ansible_user: "{{ lab_vm_user }}"
ansible_ssh_private_key_file: "{{ lab_ssh_key_path }}"
ansible_python_interpreter: /usr/bin/python3
