# Static inventory of the local KVM/QEMU lab.
#
#   kvm_hosts : the workstation running libvirt (this machine).
#   lab       : the guests, split into `gitea` (the server) and `runners`
#               (the Gitea Actions agents). Each guest declares its own
#               hardware sizing and its static address; cloud-init applies
#               the address, so adding a guest needs no libvirt DHCP change
#               as long as the IP stays inside `lab_network_cidr` and
#               outside the DHCP range.
---

all:
  children:
    kvm_hosts:
      hosts:
        localhost: {}

    lab:
      children:
        # Also hosts the internal CA (step-ca) and resolver (dnsmasq) when the
        # internal domain is enabled - no extra guest for two daemons that sit
        # idle most of the time.
        gitea:
          hosts:
            gitea-server:
              vm_ip: 192.168.170.10
              vm_mac: "52:54:00:17:0a:0a"
              vm_memory_mb: 2048
              vm_vcpus: 2
              vm_disk_size: 20G

        runners:
          hosts:
            gitea-runner-1:
              vm_ip: 192.168.170.11
              vm_mac: "52:54:00:17:0a:0b"
              vm_memory_mb: 2048
              vm_vcpus: 2
              vm_disk_size: 20G
            # Add more runner hosts here (next free address: 192.168.170.12,
            # MAC 52:54:00:17:0a:0c). Each host runs `act_runner_count`
            # agents, so a single VM is usually enough for local work.
